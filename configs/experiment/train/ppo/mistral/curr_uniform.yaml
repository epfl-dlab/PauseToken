# @package _global_
defaults:
  - train/ppo/default
  - override /rl_algorithm/policy/model/language_model:  auto_peft_for_causal_lm
  - override /rl_algorithm/policy/model/peft_config: null
  - override /rl_algorithm/policy/model/value_head: torch_transformer
  - override /trainer/callbacks/portion_annealers: linear

name: "mistral-ppo-on-gsm8k"
run_name: "mistral_ppo_uniform_curr_sft_1ep_ann_5ep"

trainer:
  callbacks:
    portion_annealers:
      lower_bound_init_portion: 0.0
      lower_bound_final_portion: 0.0
      upper_bound_init_portion: 1.0
      upper_bound_final_portion: 1.0
      warmup_timesteps: 0
      total_timesteps: 10


rl_algorithm:
  ent_coef: 0.1
  vf_coef: 1.0
  base_kl_coef: 0.1
  learning_rate: 1e-6
  batch_size: 2 # number of rollouts to be used in each training step
  n_envs: 24
  n_grad_accumulation_steps: 8
  policy:
    per_token_log_prob: true
    ft_on_action_only: true
    model:
      language_model:
        pretrained_model_name_or_path: /dlabscratch1/baldwin/pause2/PauseToken/logs/checkpoints/SFT/mistral_sft_3epochs/46c676f406cb25ae87371f2ec501182d08c7799071ecbc82a1ff4edee925babe/ckpt-12672-0.472
      value_head:
        hidden_dim: 4096

  