      lower_bound_init_portion: 0.0
      lower_bound_final_portion: 0.0
      upper_bound_init_portion: 0.0
      upper_bound_final_portion: 0.0
      warmup_timesteps: 0
      total_timesteps: 10
 

rl_algorithm:
  policy:
    model:
      language_model:
        pretrained_model_name_or_path: logs/checkpoints/SFT/qwen_0.5B_sft/3eb9199fb73db6078709dadb143d42908b16efe6170a6ae50e4d1208a6bad69c/ckpt-12672-0.274
      value_head:
        hidden_dim: 896

    generation:
      train:
        generation_config:
          eos_token_id: 151643
          pad_token_id: 151645
          bos_token_id: null
      test:
        generation_config:
          eos_token_id: 151643
          pad_token_id: 151645
          bos_token_id: null