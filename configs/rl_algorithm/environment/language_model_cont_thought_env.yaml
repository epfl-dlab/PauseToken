_target_: lm_stable_baselines.environments.LanguageModelContThoughtEnv

max_tokens: ${rl_algorithm.policy.max_output_generation_length}
require_dataset: True
filler_token: -100
max_actions: 1
hidden_size: ${rl_algorithm.policy.model.language_model.thought_embedding_head.hidden_dim}

reasoning_step_splitter: ' ' # Splitter for reasoning steps, it can be '\n' for GSM8K, or ' ' to simply split words
ground_truth_portion_dist: 0.0 # Portion of ground truth actions the environment pass as context. number between 0 and 1

ft_on_action_only: ${rl_algorithm.policy.ft_on_action_only}
n_rollouts_per_sample: 1