defaults:
  - .@language_model: auto_model_for_causal_lm

_target_: src.model.components.control_token_wrappers.ThoughtPerturbator

pretrained_model_name_or_path: ???
thought_mode: always
language_model:
  pretrained_model_name_or_path:  ${rl_algorithm.policy.model.language_model.pretrained_model_name_or_path}

config:
  _target_: src.model.components.control_token_wrappers.ThoughtPerturbatorConfig
  thought_token_id: ${get_obj_attr:${rl_algorithm.policy.model.tokenizer},['vocab_size']}
  thought_token_id_token_name: <|thought|> 
  ctrl_token_head_temperature: 1.0
  detach_ctrl_tok_clf: false

  #essential that it's in config for the model to be able to load the model (to use from_pretrained it must be serializable)
  thought_embedding_head:
    _target_: src.model.components.thought_embeddings.torch_transformer.ThoughtTransformer
    hidden_dim: 2048
    transformer_config: 
      _target_: transformers.LlamaModel
      config: 
        _target_: transformers.LlamaConfig
        vocab_size: 0
        hidden_size: ${...hidden_dim}
        num_hidden_layers: 4
        num_attention_heads: 8
        max_position_embeddings: 1025

post_instanciation_method_calls: []